# Theming
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family      JetBrains Mono Nerd Font
font_size 9.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0



# --- Terminal Functionality ---
scrollback_lines 10000
scrollback_pager_history_size 1024
# Allow shell to control the title (great for HADAL project monitoring)
shell_integration enabled

# --- Productivity ---
# Enable clickable links and mouse navigation
mouse_hide_wait 3.0
url_color #0087bd
url_style curly
open_url_with default

# --- Advanced Keyboard Workflow ---
# Use Alt+arrows to move between words (crucial for quick command editing)
map alt+left send_text all \x1b\x62
map alt+right send_text all \x1b\x66

# Clear screen and reset (much faster than typing clear)
map ctrl+l combine : clear_terminal scrollback active : send_text normal,application \x0c

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow cwd lookup from global keybindings
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
