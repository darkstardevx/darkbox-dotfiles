add_newline = true
command_timeout = 200
format = """
[$os$container]($style)[$directory$git_branch$git_status]($style)[$direnv$gcloud]($style)$rust$golang$python$nodejs$cpp$cmake$lua$dart$zig$status$character"""

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold cyan"
repo_root_style = "bold #9147a8"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

continuation_prompt = '▶▶ '

[git_branch]
format = "[$branch]($style) "
style = "italic #14B9B5"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
format     = '[$all_status]($style)'
style      = "#FF7F41"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " 🏳 "
up_to_date = " "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:252 bold fg:235)[](bold fg:252)"
trim_at = ".companyname.com"
disabled = false

# --- System context: what OS, what shell, are we in a container -----------

[os]
disabled = false
style = "bold #9147a8"
format = "[$symbol]($style) "
[os.symbols]
Arch = "󰣇"
Macos = "󰀵"
Linux = ""

[shell]
disabled = true

[container]
disabled = false
symbol = "⬢"
style = "bold #FD3E6A"
format = "[$symbol $name]($style) "

# --- Environment context: direnv, gcloud --------------------------------
# (env_var removed — it rendered its icon even with nothing set, since
#  it had no real variable name to key off. Tell me what you actually
#  want surfaced and I'll add it back properly.)

[direnv]
disabled = false
symbol = " "
style = "bold #c8e967"
format = "[$symbol $loaded/$allowed]($style) "

[gcloud]
disabled = false
symbol = "󱇶 "
style = "bold #14B9B5"
format = "[$symbol$account(@$domain)(\\($project\\))]($style) "

# --- Language/toolchain versions, one accent color per module -------------

[rust]
symbol = "󱘗 "
style = "bold #9147a8"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold #14B9B5"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "bold #c8e967"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bold #FD3E6A"
format = "[$symbol$version]($style) "

[c]
style = "bold bright-cyan"
format = " [$symbol(-$name)]($style)"
symbol = "ℂ "

[cpp]
symbol = " "
style = "bold #FF7F41"
format = "[$symbol$version]($style) "

[cmake]
symbol = " "
style = "bold #FF7F41"
format = "[$symbol$version]($style) "

[elixir]
style = "bold bright-yellow"
format = " exs [$symbol OTP $otp_version ]($style)"
symbol = " "

[elm]
style = "bold bright-red"
format = " elm [$symbol]($style)"
symbol = "◩ "

[haskell]
style = "bold bright-yellow"
format = " hs [$symbol]($style)"
symbol = "❯λ "

[julia]
style = "bold bright-cyan"
format = " jl [$symbol]($style)"
symbol = "◎ "

[java]
style = "bold bright-red"
format = " java [${symbol}]($style)"
symbol = " "

[kotlin]
format = " [kotlin](italic) [$symbol]($style)"
style = "bold bright-red"
symbol = " "

[gradle]
symbol = ""
style = ""
format = ""

[scala]
format = " scala [$symbol]($style)"
symbol = " "
style = "bold bright-cyan"

[ocaml]
format = " [ocaml](italic) [$symbol]($style)"
style = "bold bright-yellow"
symbol = " "

[haxe]
style = "bold bright-red"
format = " [haxe](italic) [$symbol]($style)"
symbol = " "

[perl]
format = " [perl](italic) [$symbol]($style)"
style = "bold bright-cyan"
symbol = " "

[crystal]
symbol = ""
style = ""
format = ""

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold blue"
symbol = " "

[lua]
symbol = " "
style = "bold #c8e967"
format = "[$symbol$version]($style) "

[dart]
symbol = " "
style = "bold #14B9B5"
format = "[$symbol$version]($style) "

[zig]
symbol = " "
style = "bold #9147a8"
format = "[$symbol$version]($style) "

# --- Last command's exit status --------------------------------------------

[status]
disabled = false
symbol = "✗"
success_symbol = ""
style = "bold #FD3E6A"
format = "[$symbol $status]($style) "
